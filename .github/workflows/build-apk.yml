name: Build M32R Offline Trainer APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project
        run: unzip -q M32R_Pro_v06_Delay_2000_4Band_Android.zip -d unpacked

      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APK
        run: gradle --no-daemon -p unpacked/M32R-Offline-Trainer-Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M32R-Pro-v06-APK
          path: unpacked/M32R-Offline-Trainer-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
