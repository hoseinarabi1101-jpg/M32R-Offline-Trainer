name: Build M32R Offline Trainer APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project
        run: unzip -q M32R_Pro_Offline_v05_Android.zip -d unpacked

      - name: Install Android SDK
      - run: unzip -q M32R_Pro_v06_Delay_2000_4Band_Android.zip -d unpacked
      - name: Build APK
        run: gradle --no-daemon -p unpacked/M32R-Offline-Trainer-Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M32R-Offline-Trainer-APK
          path: unpacked/M32R-Offline-Trainer-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
